name: CI - MLflow Training Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Jumlah pohon'
        required: false
        default: '100'
      max_depth:
        description: 'Kedalaman maksimum pohon'
        required: false
        default: '10'

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Install Dependencies
        run: |
          pip install mlflow==2.19.0 scikit-learn==1.4.2 pandas numpy matplotlib seaborn

      - name: Run MLflow Project
        run: |
          mlflow run MLProject/ \
            -P n_estimators=${{ github.event.inputs.n_estimators || '100' }} \
            -P max_depth=${{ github.event.inputs.max_depth || '10' }} \
            --env-manager=local

      - name: Upload MLflow Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-run-artifacts
          path: mlruns/
          retention-days: 30

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Image (mlflow build-docker)
        run: |
          RUN_ID=$(ls mlruns/0/ | grep -v 'meta.yaml' | head -1)
          MODEL_URI="mlruns/0/${RUN_ID}/artifacts/model"
          mlflow models build-docker \
            --model-uri "${MODEL_URI}" \
            --name "kimakimman/wine-quality-ml"
          docker push kimakimman/wine-quality-ml:latest
